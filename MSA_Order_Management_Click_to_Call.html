<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MSA Order Management</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.45 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex}
#side{width:210px;background:var(--sb);color:#cfd2d8;padding:18px 12px;flex:none;overflow:auto}#side h1{margin:0 8px;color:#fff;font-size:22px}#side small{display:block;margin:0 8px 16px;color:#8b8f98}
#side a{display:block;padding:9px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px}#side a.on{background:var(--g);color:#fff}#side a:hover:not(.on){background:#23262d}
#wrap{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column}
#top{display:flex;gap:10px;padding:12px 20px;border-bottom:1px solid var(--bd);background:var(--cd);position:sticky;top:0;z-index:5;align-items:center}
input,select,textarea,button{font:inherit;color:var(--tx)}input,select,textarea{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
#q{flex:1;min-width:0}#main{padding:20px;max-width:1300px;width:100%}h2{margin:0 0 14px;font-size:22px}h3{margin:0 0 10px;font-size:15px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.two{display:grid;gap:14px;grid-template-columns:2fr 1fr;align-items:start}.two.eq{grid-template-columns:1fr 1fr}
.k{color:var(--mu);font-size:12.5px}.big{font-size:26px;font-weight:800;margin-top:2px}.big.g{color:var(--g)}
.btn{border:1px solid var(--bd);background:var(--cd);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700}.btn.p{background:var(--g);border-color:var(--g);color:#fff}.btn.sec{background:var(--b-bg);color:var(--b-fg);border-color:var(--b-fg)}.btn:disabled{opacity:.45;cursor:default}.btn:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;cursor:default}.pill.g{background:var(--g-bg);color:var(--g-fg)}.pill.b{background:var(--b-bg);color:var(--b-fg)}.pill.a{background:var(--a-bg);color:var(--a-fg)}.pill.r{background:var(--r-bg);color:var(--r-fg)}.pill.n{background:var(--n-bg);color:var(--n-fg)}
button.pill{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:700}button.pill.on{outline:2px solid var(--g)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-weight:500;font-size:12.5px;padding:8px}td{padding:9px 8px;border-top:1px solid var(--bd)}tr.row{cursor:pointer}tr.row:hover,tr.sel{background:var(--bg)}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;margin:10px 0}.bar i{display:block}.lg{display:flex;gap:14px;flex-wrap:wrap;color:var(--mu);font-size:12.5px}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}.tl{border-left:2px solid var(--bd);padding-left:12px;margin:10px 0}.tl div{margin-bottom:8px}.lock{float:right}
.q{border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--cd);transition:background .15s,border-color .15s}.q.on{border-width:2px 2px 2px 5px}.q.status-pending{border-left-color:#b8590a;background:color-mix(in srgb,var(--a-bg) 22%,var(--cd))}.q.status-confirmed{border-left-color:#16805d;background:color-mix(in srgb,var(--g-bg) 45%,var(--cd))}.q.status-issue{border-left-color:#c47a12;background:color-mix(in srgb,var(--a-bg) 48%,var(--cd))}.q.status-rejected{border-left-color:#c33d3d;background:color-mix(in srgb,var(--r-bg) 40%,var(--cd))}.q.status-neutral{border-left-color:#7b8494;background:color-mix(in srgb,var(--n-bg) 28%,var(--cd))}.status-legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mu);margin:8px 0 14px}.status-key{display:inline-flex;align-items:center;gap:5px}.status-dot{width:10px;height:10px;border-radius:3px;display:inline-block}.status-dot.green{background:#16805d}.status-dot.amber{background:#c47a12}.status-dot.red{background:#c33d3d}.status-dot.gray{background:#7b8494}.call-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.phone-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none}.callback-field{display:block;width:100%;margin:8px 0}.history-meta{color:var(--mu);font-size:12px}
.cols{display:flex;gap:6px;align-items:flex-end;height:150px}.cols div{flex:1;background:var(--g);border-radius:6px 6px 0 0;position:relative;min-height:4px}.cols b{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--sb);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:99;max-width:90vw}

@media(max-width:800px){body{flex-direction:column}#side{width:100%;display:flex;gap:4px;overflow-x:auto;padding:8px}#side h1,#side small{display:none}#side a{white-space:nowrap;margin:0}.two,.two.eq{grid-template-columns:1fr}#top{flex-wrap:wrap}#main{padding:12px}}
</style></head><body>
<nav id="side"></nav>
<div id="wrap">
  <div id="top">
    <input id="q" placeholder="Search order, phone, consignment no." oninput="ui.q=this.value;if(ui.role=='Owner'&&ui.view!='orders')ui.view='orders';draw()">
    <select id="st" onchange="ui.store=this.value;draw()"></select>
    <select id="dt" onchange="ui.dr=this.value;draw()"><option value="all">All time</option><option value="today">Today</option><option value="yest">Yesterday</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="c">Custom range</option></select>
    <span id="cu" style="display:contents"></span>
    <select id="role" onchange="setRole(this.value)"><option>Owner</option><option>Caller</option></select>
    <button class="btn" style="padding:6px 12px;font-size:12px;display:inline-flex;align-items:center;gap:6px" onclick="syncBackend()" title="Click to sync state with backend server">
      <span id="sync-dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#e3a008"></span>
      <span id="sync-text">Local Mode</span>
    </button>
  </div>
  <main id="main"></main>
</div>
<div id="toast"></div>
<div id="modal-container"></div>

<script>
const COUR=['PostEx','Leopards','Trax'],PRE=['PX','LP','TX'],DAY=864e5,PATH=['Booked','In Transit','Out for Delivery','Delivered'],RET=['Booked','In Transit','Return in Transit','Returned to Sender'];
const NM=['Ayesha Khan','Bilal Ahmed','Hina Raza','Usman Ali','Sana Malik','Zain Abbas','Noor Fatima','Hamza Sheikh','Iqra Javed','Fahad Mirza','Maryam Tariq','Talha Butt'],IT=['Lawn suit · M','Khussa · 39','Bedsheet · King','Kurta · L','Handbag · Tan','Perfume · 100ml'],CITY=['Faisalabad','Lahore','Karachi','Multan','Islamabad','Sialkot'];
const RAWS={Booked:'Order booked','In Transit':'Arrived at hub','Out for Delivery':'With rider','Delivered':'Delivered to consignee','Return in Transit':'Return initiated','Returned to Sender':'Returned to shipper'};
const CALL=['Pending Call','Confirmed','Cancelled','No Answer','Call Back Later','Wrong Number'],COL={'Pending Call':'a',Confirmed:'g',Cancelled:'r','No Answer':'n','Call Back Later':'a','Wrong Number':'r','Ready to Book':'n','Booking Failed':'r',Booked:'b','In Transit':'b','Out for Delivery':'b',Delivered:'g','Return in Transit':'a','Returned to Sender':'n','—':'n',Matched:'g','Short payment':'r','Needs review':'a',Unmatched:'n'};
let S=load()||seed();S.o.forEach(o=>{o.at=Array.isArray(o.at)?o.at:[]});DEF();let ui={dr:'all',d1:'',d2:'',view:'dashboard',role:'Owner',store:'all',q:'',f:'All',sel:new Set(),callSel:new Set(),asgFilter:'all',open:null,tab:'Pending Call',cour:'PostEx',sf:'All',cid:null};

let backendUrl = localStorage.getItem('msa_backend_url') || (window.location.protocol === 'file:' ? 'http://localhost:5000/api' : `${window.location.origin}/api`);
let isBackendConnected = false;

function load(){try{return JSON.parse(localStorage.getItem('msa2'))}catch(e){return null}}
function save(){try{localStorage.setItem('msa2',JSON.stringify(S))}catch(e){}}
function mk(i,t){return{id:i,no:'MSA-'+(1040+i),store:i%4,cust:NM[i%12],phone:'03'+(10+i%5)+'-'+(2000000+i*48271),addr:'House '+(10+i*3)+', Block '+'ABCD'[i%4]+', '+CITY[i%6],item:IT[i%6],cod:Math.round((1800+i*730%5200)/50)*50,call:'Pending Call',at:[],ship:null,t:t}}
function seed(){const n=Date.now(),o=[];for(let i=0;i<24;i++){const x=mk(i,n-(26-i)*DAY/2);x.call=i<6?'Pending Call':i==6?'No Answer':i==7?'Call Back Later':i==8?'Cancelled':i==9?'Wrong Number':'Confirmed';if(i>5)x.at.push({t:x.t+36e5,out:x.call,note:'',by:'Caller'});if(i==7)x.cb=n-36e5;
if(i>=12){const c=i%3,st=i<13?'':i<15?'Booked':i<18?'In Transit':i==18?'Out for Delivery':i<22?'Delivered':i==22?'Return in Transit':'Returned to Sender';
if(i==12)x.ship={courier:COUR[c],failed:true,err:'Consignee city not recognised by courier',ev:[]};else{const P=(st=='Return in Transit'||st=='Returned to Sender')?RET:PATH,ev=[];for(let k=0;k<=P.indexOf(st);k++)ev.push({s:P[k],raw:RAWS[P[k]],t:x.t+DAY/2+k*DAY*.8});x.ship={courier:COUR[c],cn:PRE[c]+(700100+i),status:st,ev,rep:null,rec:null};
if(st=='Delivered'&&i<21){x.ship.rep=i==20?x.cod-200:x.cod;x.ship.rec=i==19?x.cod:i==20?x.cod-200:null}}}o.push(x)}
return{o,cfg:{PostEx:{ok:true,mode:'Live API',acc:'PostEx Official',token:'',pickupId:'001'},Leopards:{ok:true,mode:'Live API',acc:'Leopards Direct',apiKey:'',apiPassword:''},Trax:{ok:true,mode:'Live API',acc:'Trax Prime',apiKey:'',pickupId:'1'}},lag:[0,0,1,0],audit:[]}}

const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),R=n=>'PKR '+Math.round(n).toLocaleString('en-PK'),pill=(t,c)=>`<span class="pill ${c||COL[t]||'n'}">${e(t)}</span>`,T=t=>new Date(t).toLocaleString('en-PK',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const sl=o=>o.ship?(o.ship.failed?'Booking Failed':o.ship.status):o.call=='Confirmed'?'Ready to Book':'—',ss=o=>o.ship&&!o.ship.failed,sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);

function phoneInfo(raw){const digits=String(raw||'').replace(/[\s().-]/g,'');let normalized=digits;if(/^03[0-9]{9}$/.test(digits))normalized='+92'+digits.slice(1);else if(/^\+923[0-9]{9}$/.test(digits))normalized=digits;else return{valid:false,href:''};return{valid:true,href:'tel:'+normalized,normalized}}
function callNow(id){const o=S.o.find(x=>x.id===id);if(!o)return false;const p=phoneInfo(o.phone);if(!p.valid){toast('Invalid customer phone. Update it to a valid Pakistan mobile number first.');return false;}o.at.push({t:Date.now(),out:'Call Started',note:'Opened device calling app via click-to-call.',by:ui.role});log(o.no+': Call Now clicked');save();return true}
function callbackValue(o){return o.cb?new Date(o.cb).toLocaleString('en-PK',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';}
function callStatusClass(status){if(status==='Confirmed')return'status-confirmed';if(['Cancelled','Wrong Number'].includes(status))return'status-rejected';if(['No Answer','Call Back Later','Request correction'].includes(status))return'status-issue';if(status==='Pending Call')return'status-pending';return'status-neutral';}
function callStatusLabel(status){return status==='Confirmed'?'Called · Confirmed':['Cancelled','Wrong Number'].includes(status)?'Rejected / Problem':['No Answer','Call Back Later','Request correction'].includes(status)?'Call issue / Follow-up':status;}
function log(a){S.audit.unshift({t:Date.now(),by:ui.role,a});S.audit=S.audit.slice(0,100)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',3000)}
function inR(o){const d=new Date();d.setHours(0,0,0,0);const s=+d,t=o.t;switch(ui.dr){case'today':return t>=s;case'yest':return t>=s-DAY&&t<s;case'7':return t>=s-6*DAY;case'30':return t>=s-29*DAY;case'c':return(!ui.d1||t>=+new Date(ui.d1+'T00:00'))&&(!ui.d2||t<+new Date(ui.d2+'T00:00')+DAY);default:return true}}
function list(){const q=ui.q.toLowerCase();return S.o.filter(o=>inR(o)&&(ui.store=='all'||o.store==ui.store)&&(!q||(o.no+o.phone+o.cust+(o.ship?.cn||'')).toLowerCase().includes(q)))}
function setRole(r){ui.role=r;ui.view=r=='Caller'?'calling':'dashboard';ui.open=null;draw()}

// -------------------------------------------------------------
// EXCEL / CSV EXPORT ENGINE
// -------------------------------------------------------------
function exportCSV(filename, headers, rows) {
  const escapeVal = val => `"${String(val ?? '').replace(/"/g, '""')}"`;
  const csvContent = '\uFEFF' + [headers.map(escapeVal).join(','), ...rows.map(row => row.map(escapeVal).join(','))].join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
  URL.revokeObjectURL(link.href);
  toast('📥 Exported ' + filename);
}

function exportOrdersCSV() {
  const L = list();
  const headers = ['Order No', 'Store', 'Customer Name', 'Phone', 'Address', 'Item', 'COD Amount (PKR)', 'Call Status', 'Shipment Status', 'Courier', 'Consignment No', 'Order Placed At'];
  const rows = L.map(o => [
    o.no,
    'Store ' + (o.store + 1),
    o.cust,
    o.phone,
    o.addr,
    o.item,
    o.cod,
    o.call,
    sl(o),
    o.ship?.courier || '—',
    o.ship?.cn || '—',
    new Date(o.t).toLocaleString('en-PK')
  ]);
  exportCSV(`MSA_Orders_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

function exportCODCSV() {
  const D = list().filter(o => ss(o) && o.ship.status == 'Delivered');
  const headers = ['Consignment No', 'Courier', 'Order No', 'Customer', 'Expected COD', 'Courier Reported', 'Bank Received', 'Reconciliation Status'];
  const rows = D.map(o => [
    o.ship.cn,
    o.ship.courier,
    o.no,
    o.cust,
    o.cod,
    o.ship.rep ?? '—',
    o.ship.rec ?? 'Pending',
    mt(o)
  ]);
  exportCSV(`MSA_COD_Reconciliation_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

function exportReportsCSV() {
  const L = list();
  const headers = ['Courier', 'Total Booked', 'Booking Success Rate', 'Delivery Rate', 'Return Rate', 'Avg Days'];
  const rows = COUR.map(c => {
    const all = L.filter(o => o.ship?.courier == c);
    const ok = all.filter(ss);
    const cl = ok.filter(o => ['Delivered', 'Returned to Sender'].includes(o.ship.status));
    const dv = cl.filter(o => o.ship.status == 'Delivered');
    const d = dv.map(o => (o.ship.ev.at(-1).t - o.ship.ev[0].t) / DAY);
    return [
      c,
      all.length,
      pc(ok.length, all.length),
      pc(dv.length, cl.length),
      pc(cl.length - dv.length, cl.length),
      d.length ? (sum(d, x => x) / d.length).toFixed(1) : '—'
    ];
  });
  exportCSV(`MSA_Courier_Performance_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

function exportAuditCSV() {
  const headers = ['Timestamp', 'Actor Role / Name', 'Action Details'];
  const rows = S.audit.map(a => [new Date(a.t).toLocaleString('en-PK'), a.by, a.a]);
  exportCSV(`MSA_Audit_Logs_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

// -------------------------------------------------------------
// BACKEND SYNC & CLOUD CONNECTION
// -------------------------------------------------------------
async function checkBackend() {
  try {
    const res = await fetch(`${backendUrl}/health`, { signal: AbortSignal.timeout(2000) });
    if (res.ok) {
      isBackendConnected = true;
      updateSyncBadge(true);
    } else {
      isBackendConnected = false;
      updateSyncBadge(false);
    }
  } catch (e) {
    isBackendConnected = false;
    updateSyncBadge(false);
  }
}

function updateSyncBadge(online) {
  const dot = $('#sync-dot');
  const txt = $('#sync-text');
  if (!dot || !txt) return;
  if (online) {
    dot.style.background = '#10b981';
    txt.textContent = 'Cloud Synced';
  } else {
    dot.style.background = '#e3a008';
    txt.textContent = 'Local Mode';
  }
}

async function syncBackend() {
  toast('Syncing state with backend server...');
  try {
    const res = await fetch(`${backendUrl}/sync-state`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orders: S.o, audit: S.audit }),
    });
    if (res.ok) {
      const data = await res.json();
      if (data.orders && Array.isArray(data.orders)) {
        S.o = data.orders;
      }
      isBackendConnected = true;
      updateSyncBadge(true);
      save();
      draw();
      toast('✅ State synced with server (' + S.o.length + ' orders updated)');
    } else {
      throw new Error('Sync status ' + res.status);
    }
  } catch (err) {
    isBackendConnected = false;
    updateSyncBadge(false);
    toast('⚠️ Backend server offline. Running safely on LocalStorage. (Start server: node server.js)');
  }
}

// -------------------------------------------------------------
// VIEWS & NAVIGATION
// -------------------------------------------------------------
const NAV=[['dashboard','Dashboard'],['orders','All Orders'],['calling','Calling Team'],['queue','Shipment Queue'],['tracking','Shipments & Tracking'],['cod','COD Reconciliation'],['reports','Reports'],['staff','Staff Management'],['shop','Shopify & Webhooks'],['couriers','Courier Settings'],['audit','Audit Logs'],['sys','System Settings']];

function draw(){
  $('#dt').value=ui.dr;
  $('#cu').innerHTML=ui.dr=='c'?`<input type="date" aria-label="From date" value="${ui.d1}" onchange="ui.d1=this.value;draw()"><input type="date" aria-label="To date" value="${ui.d2}" onchange="ui.d2=this.value;draw()">`:'';
  $('#st').innerHTML='<option value="all">All 4 stores</option>'+[0,1,2,3].map(i=>`<option value="${i}" ${ui.store==i?'selected':''}>Store ${i+1}</option>`).join('');
  $('#side').innerHTML='<h1>MSA</h1><small>Order Management</small>'+NAV.filter(n=>ui.role=='Owner'||n[0]=='calling').map(n=>`<a tabindex=0 class="${ui.view==n[0]?'on':''}" onclick="ui.view='${n[0]}';ui.open=null;draw()" onkeydown="if(event.key=='Enter')this.click()">${n[1]}</a>`).join('');
  $('#main').innerHTML=V[ui.view]();
  save();
  updateSyncBadge(isBackendConnected);
}

const V={};

// Dashboard
V.dashboard=()=>{
  const L=list(),n=f=>L.filter(f).length,tr=o=>ss(o)&&['In Transit','Out for Delivery'].includes(o.ship.status),dl=o=>ss(o)&&o.ship.status=='Delivered',rt=o=>ss(o)&&o.ship.status.startsWith('Return')||ss(o)&&o.ship.status=='Returned to Sender';
  const P=[['Pending',n(o=>o.call=='Pending Call'),'#b8590a'],['Confirmed',n(o=>sl(o)=='Ready to Book'||sl(o)=='Booking Failed'),'#1f4b8f'],['Booked',n(o=>ss(o)&&o.ship.status=='Booked'),'#5a67ad'],['In transit',n(tr),'#7a92bd'],['Delivered',n(dl),'#0f6b5a'],['Returned',n(rt),'#a02323']];

// COURIER BOOKING ENGINE (Live API / Backend proxy / Simulation)
async function book(){
  const c=ui.cour;
  if(!S.cfg[c].ok)return toast(c+' is not connected. Configure it in Courier Settings first.');
  let ok=0,bad=0;
  const ids=Array.from(ui.sel);
  toast(`Booking ${ids.length} orders via ${c}...`);

  for(const i of ids){
    const o=S.o.find(x=>x.id===i);
    if(!o||(o.ship&&!o.ship.failed))continue;

    // Check if Live API mode with backend server is enabled
    if(S.cfg[c].mode==='Live API'&&isBackendConnected){
      try{
        const res=await fetch(`${backendUrl}/couriers/book`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({courier:c,order:o,config:S.cfg[c]})
        });
        const data=await res.json();
        if(data.success){
          o.ship={
            courier:c,
            cn:data.trackingNumber,
            status:'Booked',
            ev:[{s:'Booked',raw:data.mode==='live'?'Booked via Live '+c+' API':'Booked (Simulated)',t:Date.now()}],
            rep:null,
            rec:null
          };
          ok++;
        }else{
          o.ship={courier:c,failed:true,err:data.error||'Courier booking rejected',ev:[]};
          bad++;
        }
      }catch(err){
        // fallback
        o.ship={courier:c,cn:PRE[COUR.indexOf(c)]+(800000+o.id),status:'Booked',ev:[{s:'Booked',raw:RAWS.Booked,t:Date.now()}],rep:null,rec:null};
        ok++;
      }
    }else{
      // Simulation mode
      if(o.cust.length%5==0&&!o.retry){
        o.retry=1;
        o.ship={courier:c,failed:true,err:'Consignee city not recognised by courier',ev:[]};
        bad++;
        continue;
      }
      o.ship={courier:c,cn:PRE[COUR.indexOf(c)]+(800000+o.id),status:'Booked',ev:[{s:'Booked',raw:RAWS.Booked,t:Date.now()}],rep:null,rec:null};
      ok++;
    }
  }

  log(`Booked ${ok} via ${c}${bad?', '+bad+' failed':''}`);
  ui.sel.clear();
  draw();
  toast(`${ok} booked via ${c}${bad?', '+bad+' failed':''}.`);
}

async function saveEditedOrder(id){
  const o = S.o.find(x => x.id === id);
  if(!o) return;

  const cust = $('#edit-cust').value.trim();
  const phone = $('#edit-phone').value.trim();
  const addr = $('#edit-addr').value.trim();
  const item = $('#edit-item').value.trim();
  const cod = Math.round(parseFloat($('#edit-cod').value) || 0);
  const note = $('#edit-note').value.trim();

  if(!cust) return toast('Customer name is required.');
  if(!phone) return toast('Phone number is required.');
  if(!addr) return toast('Delivery address is required.');

  const changes = [];
  if(o.cust !== cust) changes.push(`Name: ${cust}`);
  if(o.phone !== phone) changes.push(`Phone: ${phone}`);
  if(o.addr !== addr) changes.push(`Address updated`);
  if(o.item !== item) changes.push(`Item: ${item}`);
  if(o.cod !== cod) changes.push(`COD: PKR ${cod}`);

  o.cust = cust;
  o.phone = phone;
  o.addr = addr;
  o.item = item;
  o.cod = cod;
  if(o.corr) delete o.corr;

  const editLogText = changes.length ? `Edited (${changes.join(', ')})` : 'Order details verified';
  o.at.push({
    t: Date.now(),
    out: 'Details Edited',
    note: note ? `${editLogText} — ${note}` : editLogText,
    by: ui.role
  });

  log(`${o.no}: details edited by ${ui.role}`);
  closeModal();
  save();
  draw();
  toast(`✅ Order ${o.no} updated successfully!`);

  // Sync to backend server if online
  if(isBackendConnected){
    try {
      fetch(`${backendUrl}/orders/${o.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(o)
      });
    } catch(e) {}
  }
}

function getCallingFilteredOrders(){

async function bulkAssignCaller(callerName){
  if(!callerName) return;
  if(!ui.callSel.size) return toast('Please check at least 1 order using the checkboxes first.');

  if(callerName === '__new__'){
    const newCaller = prompt('Enter new caller email or name:');
    if(!newCaller || !newCaller.trim()) return draw();
    const name = newCaller.trim();
    if(!S.staff.some(s => s.n.toLowerCase() === name.toLowerCase())){
      S.staff.push({ n: name, r: 'Caller', a: 1 });
    }
    callerName = name;
  }

  const isUnassign = callerName === '__unassign__';
  const targetLabel = isUnassign ? 'Unassigned' : callerName;
  let count = 0;

  ui.callSel.forEach(id => {
    const o = S.o.find(x => x.id === id);
    if(o){
      if(isUnassign) delete o.asg;
      else o.asg = callerName;
      o.at.push({
        t: Date.now(),
        out: 'Assigned',
        note: isUnassign ? 'Order unassigned' : `Assigned to ${callerName}`,
        by: ui.role
      });
      count++;
    }
  });

  log(`Assigned ${count} orders to ${targetLabel}`);
  ui.callSel.clear();
  save();
  draw();
  toast(`✅ Successfully assigned ${count} orders to ${targetLabel}!`);

  if(isBackendConnected){
    try {
      fetch(`${backendUrl}/sync-state`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orders: S.o, audit: S.audit })
      });
    } catch(e) {}
  }
}

function inlineAssignOrder(id, callerName){
  const o = S.o.find(x => x.id === id);
  if(!o) return;
  if(!callerName || callerName === '__unassign__') {
    delete o.asg;
  } else {
    o.asg = callerName;
  }
  o.at.push({
    t: Date.now(),
    out: 'Assigned',
    note: o.asg ? `Assigned to ${o.asg}` : 'Order unassigned',
    by: ui.role
  });
  save();
  draw();
  toast(`Updated assignment for #${o.no}`);
  if(isBackendConnected){
    try {
      fetch(`${backendUrl}/orders/${o.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(o)
      });
    } catch(e) {}
  }
}

function act(out){
  const o=S.o.find(x=>x.id===ui.open);
  if(!o)return toast('Select an order first.');
  const note=$('#note')?.value.trim()||'';
  if(out=='Cancelled'){
    if(o.ship&&!o.ship.failed)return toast('This order is already booked with a courier, so it cannot be cancelled here.');
    o.reason=$('#cr').value;
    if(o.reason=='Other'&&!note)return toast('Add a note explaining why this order is cancelled.');
  }
  if(out=='Request correction'&&!note)return toast('Describe what needs correcting in the call notes.');
  let callbackAt=null;
  if(out=='Call Back Later'){
    const raw=$('#cbtime')?.value;
    if(!raw)return toast('Choose a callback date and time.');
    callbackAt=new Date(raw).getTime();
    if(!Number.isFinite(callbackAt)||callbackAt<=Date.now())return toast('Callback time must be in the future.');
  }
  o.at.push({t:Date.now(),out,note:out=='Cancelled'?o.reason+(note?' — ':'')+note:note,by:ui.role,...(callbackAt?{callbackAt}:{})});
  if(out=='Request correction')o.corr=true;
  else{
    o.call=out;
    if(out=='Call Back Later')o.cb=callbackAt;
    if(out=='No Answer'&&S.set.auto&&o.at.filter(a=>a.out=='No Answer').length>=S.set.max)o.call='Cancelled';
  }
  log(`${o.no}: ${out}${callbackAt?' for '+new Date(callbackAt).toLocaleString():''}`);
  ui.open=null;
  draw();
  toast(o.no+' marked '+out+'.');
}

function adv(fw){
  const o=S.o.find(x=>x.id===ui.cid);
  if(!o||!o.ship)return;
  const s=o.ship,st=s.status,P=s.ev.some(v=>v.s=='Return in Transit')||(!fw&&['In Transit','Out for Delivery'].includes(st))?RET:PATH;
  let nx=fw?P[P.indexOf(st)+1]:(P==RET&&st!='Booked'?null:'Return in Transit');
  if(!fw&&['In Transit','Out for Delivery'].includes(st))nx='Return in Transit';
  if(!nx||st=='Delivered'||st=='Returned to Sender')return toast('This shipment is closed.');
  if(nx=='Returned to Sender'&&st!='Return in Transit')return;
  s.status=nx;
  s.ev.push({s:nx,raw:RAWS[nx],t:Date.now()});
  if(nx=='Delivered')s.rep=null;
  log(`${s.cn} → ${nx}`);
  draw();
}

</div>

<div class="card tw">
  <table><tr><th>Store<th>Shopify domain<th>Orders<th>Last sync<th>Status<th></tr>
  ${S.stores.map((s,i)=>`<tr><td>Store ${i+1}<td><input value="${e(s.dom)}" style="width:100%;min-width:190px" onchange="S.stores[${i}].dom=this.value.trim();save()"><td>${S.o.filter(o=>o.store==i).length}<td>${T(s.last)}<td>${pill(!s.on?'Disconnected':S.lag[i]?'Sync lag':'Connected',!s.on?'n':S.lag[i]?'a':'g')}<td><button class="btn" onclick="syncOne(${i})" ${s.on?'':'disabled'}>Sync now</button> <button class="btn" onclick="tgSt(${i})">${s.on?'Disconnect':'Connect'}</button></tr>`).join('')}
  </table>
</div>`;

function openShopifyImportModal(){
  const m=$('#modal-container');
  m.innerHTML=`
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <h3 style="margin-top:0">Import Shopify Order (JSON)</h3>
      <p class="k">Paste a Shopify <code>orders/create</code> JSON payload, or click below to load a sample order.</p>
      <textarea id="shopify-json-input" rows="8" style="width:100%;font-family:monospace;font-size:12px" placeholder='Paste Shopify Order JSON here...'></textarea>
      <div class="row2" style="justify-content:space-between;margin-top:14px">
        <button class="btn" onclick="loadSampleShopifyOrder()">Load Sample JSON</button>
        <div>
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn p" onclick="processShopifyImport()">Import into Queue</button>
        </div>
      </div>
    </div>
  </div>`;
}

function closeModal(){$('#modal-container').innerHTML='';}

function loadSampleShopifyOrder(){
  const sample={
    id: 8291048201,
    name: "#GLV-9402",
    total_price: "4200.00",
    created_at: new Date().toISOString(),
    customer: { first_name: "Mahnoor", last_name: "Tariq", phone: "+923214589210" },
    shipping_address: {
      name: "Mahnoor Tariq",
      phone: "03214589210",
      address1: "House 45, Street 8, Sector F-8/2",
      city: "Islamabad"
    },
    line_items: [{ title: "Gluvea Vitamin C Serum", quantity: 1 }, { title: "Daily Sunscreen SPF50", quantity: 1 }]
  };
  $('#shopify-json-input').value = JSON.stringify(sample, null, 2);
}

function processShopifyImport(){
  try{
    const val = $('#shopify-json-input').value.trim();
    if(!val)return toast('Please paste JSON data first.');
    const data = JSON.parse(val);
    const newOrder = {
      id: S.o.length ? Math.max(...S.o.map(o=>o.id||0))+1 : 1,
      no: data.name || 'MSA-'+(1100+S.o.length),
      store: 0,
      cust: data.shipping_address?.name || (data.customer?.first_name+' '+(data.customer?.last_name||'')) || 'Shopify Customer',
      phone: data.shipping_address?.phone || data.customer?.phone || '',
      addr: (data.shipping_address?.address1 || '') + (data.shipping_address?.city ? ', '+data.shipping_address.city : ''),
      item: (data.line_items||[]).map(i=>`${i.title} (${i.quantity}x)`).join(', ') || 'Online Order',
      cod: Math.round(parseFloat(data.total_price||'0')),
      call: 'Pending Call',
      at: [],
      ship: null,
      t: Date.now(),
      source: 'Shopify Import'
    };
    S.o.unshift(newOrder);
    log(`Imported Shopify order ${newOrder.no}`);
    closeModal();
    draw();
    toast(`✅ Order ${newOrder.no} successfully imported into Pending Call queue!`);
  }catch(err){
    toast('❌ Invalid JSON format: '+err.message);
  }
}

function syncOne(i){
  const x=mk(S.o.length,Date.now());
  x.store=i;
  x.cust=NM[(S.o.length*7)%12];
  S.o.push(x);
  S.lag[i]=0;
  S.stores[i].last=Date.now();
  log('Synced Store '+(i+1));
  draw();
  toast('Store '+(i+1)+' synced. 1 new order waiting for a call.');
}

function tgSt(i){
  S.stores[i].on=!S.stores[i].on;
  log((S.stores[i].on?'Connected':'Disconnected')+' Store '+(i+1));
  draw();
}

V.sys=()=>{
  const s=S.set;
  return`<h2>System Settings & Cloud Sync</h2>
  <div class="card" style="max-width:640px">
    <h3>🌐 Backend Server & API Connection</h3>
    <label class="k">Backend API Endpoint</label><br>
    <input id="cfg-backend-url" style="width:100%" value="${e(backendUrl)}" placeholder="http://localhost:5000/api"><br><br>
    <button class="btn p" onclick="saveBackendUrl()">Update Server URL</button>
    <button class="btn" onclick="checkBackend();toast('Checking server connection...')">Test Ping</button>
  </div>
  <div class="card" style="max-width:640px">
    <h3>📞 Calling Rules</h3>
    <label class="k">Callback delay (minutes)</label><br>
    <input type="number" min="5" value="${s.cb}" onchange="S.set.cb=+this.value||60;save()"><br><br>
    <label class="k">Maximum no-answer attempts</label><br>
    <input type="number" min="1" value="${s.max}" onchange="S.set.max=+this.value||3;save()"><br><br>
    <label><input type="checkbox" ${s.auto?'checked':''} onchange="S.set.auto=this.checked;save()"> Cancel an order automatically after the maximum no-answer attempts</label>
  </div>
  <div class="card" style="max-width:640px">
    <h3>Data Management</h3>
    <p class="k">Reset restores sample orders, staff, and simulated couriers.</p>
    <button class="btn" onclick="rst()">${ui.rc?'Click again to confirm reset':'Reset sample data'}</button>
  </div>`;
};

function saveBackendUrl(){
  const val = $('#cfg-backend-url').value.trim();
  if(!val)return toast('Please enter a valid backend URL.');
  backendUrl = val;
  localStorage.setItem('msa_backend_url', backendUrl);
  checkBackend();
  toast('Backend URL updated to: '+backendUrl);
}

function rst(){
  if(!ui.rc){ui.rc=1;return draw()}
  ui.rc=0;
  S=seed();
  DEF();
  ui.sel.clear();
  ui.open=null;
  log('Reset sample data');
  draw();
  toast('Sample data restored.');
}
